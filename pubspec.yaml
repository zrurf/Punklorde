  build_runner: ^2.15.1
  envied_generator: ^1.3.8
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - LICENSE
    - assets/icon/
    - assets/images/app/
    - assets/images/logo/
    - assets/images/banner/
    - assets/module/chaoxing/certs/
    - assets/module/chaoxing/scripts/

  fonts:
    - family: AlteDIN1451
      fonts:
        - asset: assets/fonts/AlteDin1451MittelschriftGepraegt-oMea.ttf